<!DOCTYPE html>
<html>
<head>
    <title>Webinar Certificate Generator</title>
</head>
<body>
    <h2>Generate Your Certificate</h2>
    <form method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Webinar Title:</label><br>
        <input type="text" name="webinar" required><br><br>

        <label>Date:</label><br>
        <input type="text" name="date" required><br><br>

        <button type="submit">Generate Certificate</button>
    </form>
</body>
</html>
